<style>
:root{
  --ink:#0f1620; --ink-2:#18222f; --line:#2a3747;
  --text:#eef3f8; --muted:#9fb0c3;
  --home:#e8863f; --home-d:#b9631f;
  --away:#2f9e9b; --away-d:#1f726f;
  --ball:#f4d03f;
  --danger:#e0524d;
  --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; margin:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  background:var(--ink); color:var(--text);
  display:flex; flex-direction:column; overflow:hidden;
  height:100dvh;
  user-select:none; -webkit-user-select:none;
}
button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer;}

/* ---- top bar ---- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:8px; padding:8px 12px; background:var(--ink-2); border-bottom:1px solid var(--line);
  flex:0 0 auto;
}
.topbar .setinfo{display:flex; align-items:baseline; gap:10px; min-width:0;}
.setinfo .setno{font-size:1.15rem; font-weight:800;}
.setinfo .fmt{font-size:.78rem; color:var(--muted); white-space:nowrap;}
.setinfo .deciding{color:var(--ball); font-weight:700; font-size:.78rem;}
.setscores{font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.topbar .tools{display:flex; gap:6px; flex:0 0 auto;}
.iconbtn{
  padding:8px 12px; border-radius:10px; background:#22303f; font-size:.82rem; font-weight:700;
  display:flex; align-items:center; gap:5px; border:1px solid var(--line);
}
.iconbtn:active{transform:scale(.96);}

/* ---- court ---- */
.court{display:flex; flex:1 1 auto; min-height:0;}
.side{
  position:relative; flex:1 1 0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; overflow:hidden;
  transition:background .15s;
}
.side.home{background:linear-gradient(160deg,var(--home-d),#7c4114);}
.side.away{background:linear-gradient(160deg,var(--away-d),#134846);}
.side:active{filter:brightness(1.12);}
.side .name{
  position:absolute; top:10px; left:0; right:0; text-align:center;
  font-size:1.1rem; font-weight:800; padding:0 8px; letter-spacing:.02em;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.side .name .edit{opacity:.55; font-size:.9rem;}
.sets-won{
  position:absolute; top:44px; left:0; right:0; display:flex; justify-content:center; gap:7px;
}
.sets-won .dot{width:13px; height:13px; border-radius:50%; background:rgba(255,255,255,.28);}
.sets-won .dot.on{background:#fff;}
.score{
  font-size:min(42vw,34vh); font-weight:800; line-height:.9; font-variant-numeric:tabular-nums;
  text-shadow:0 4px 18px rgba(0,0,0,.35);
}
.serve{
  position:absolute; bottom:78px; height:34px; display:flex; align-items:center; gap:6px;
  font-size:.8rem; font-weight:700; opacity:0; transition:opacity .15s;
}
.serve.on{opacity:1;}
.serve .ball{
  width:26px; height:26px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, var(--ball) 70%);
  box-shadow:0 0 0 2px rgba(0,0,0,.15), 0 3px 8px rgba(0,0,0,.3); position:relative;
}
.serve .ball::before,.serve .ball::after{
  content:""; position:absolute; inset:3px; border-radius:50%;
  border:1.5px solid rgba(0,0,0,.35); border-top-color:transparent; border-left-color:transparent;
}
.serve .ball::after{transform:rotate(120deg);}
.tapHint{position:absolute; bottom:46px; font-size:.72rem; color:rgba(255,255,255,.6);}

/* per-side mini controls */
.minictl{position:absolute; bottom:10px; display:flex; gap:8px; align-items:center;}
.minibtn{
  padding:7px 12px; border-radius:999px; background:rgba(0,0,0,.28); font-size:.78rem; font-weight:700;
  border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(2px);
}
.minibtn:active{transform:scale(.94);}
.minibtn.to span{font-variant-numeric:tabular-nums;}

.divider{width:2px; background:rgba(255,255,255,.14); flex:0 0 auto;}

/* ---- bottom bar ---- */
.bottombar{
  display:flex; gap:8px; padding:8px 12px; background:var(--ink-2);
  border-top:1px solid var(--line); flex:0 0 auto; justify-content:center; align-items:center;
}
.bigbtn{
  padding:11px 20px; border-radius:12px; background:#22303f; font-size:.9rem; font-weight:800;
  border:1px solid var(--line); display:flex; align-items:center; gap:7px;
}
.bigbtn:active{transform:scale(.96);}
.bigbtn.undo{background:#2b3a4b;}
.bigbtn:disabled{opacity:.4;}

/* ---- toast / banners ---- */
.toast{
  position:fixed; left:50%; top:64px; transform:translateX(-50%);
  background:#22303f; border:1px solid var(--line); color:var(--text);
  padding:12px 18px; border-radius:12px; font-weight:700; font-size:.95rem;
  box-shadow:0 8px 30px rgba(0,0,0,.5); z-index:40; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---- match over overlay ---- */
.overlay{
  position:fixed; inset:0; background:rgba(8,12,18,.86); z-index:50;
  display:none; align-items:center; justify-content:center; flex-direction:column; gap:20px; padding:24px;
  text-align:center; backdrop-filter:blur(3px);
}
.overlay.show{display:flex;}
.overlay .trophy{font-size:3.4rem;}
.overlay h2{margin:0; font-size:1.8rem;}
.overlay .final{font-size:1.05rem; color:var(--muted); font-variant-numeric:tabular-nums; line-height:1.7;}

/* ---- settings sheet ---- */
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; display:none;}
.sheet-bg.show{display:block;}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--ink-2);
  border-top:1px solid var(--line); border-radius:20px 20px 0 0; padding:18px 18px 26px;
  transform:translateY(100%); transition:transform .25s; max-width:560px; margin:0 auto;
}
.sheet.show{transform:translateY(0);}
.sheet h3{margin:4px 0 16px; font-size:1.15rem;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:.82rem; color:var(--muted); margin-bottom:7px; font-weight:700;}
.field input[type=text]{
  width:100%; padding:11px 12px; border-radius:10px; background:var(--ink); color:var(--text);
  border:1px solid var(--line); font-size:1rem;
}
.seg{display:flex; gap:8px;}
.seg button{
  flex:1; padding:11px; border-radius:10px; background:var(--ink); border:1px solid var(--line);
  font-weight:800; font-size:.95rem;
}
.seg button.active{background:var(--home); border-color:var(--home); color:#241205;}
.seg.away button.active{background:var(--away); border-color:var(--away); color:#04211f;}
.sheet .row{display:flex; gap:10px; margin-top:8px;}
.sheet .row .bigbtn{flex:1; justify-content:center;}
.sheet .danger{background:#3a2626; border-color:#5a2f2c; color:#f0b4b0;}
.hint{font-size:.78rem; color:var(--muted); margin-top:-8px; margin-bottom:16px; line-height:1.5;}

/* ---- history ---- */
.hist-list{max-height:60vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
.hist-empty{color:var(--muted); text-align:center; padding:30px 0; font-size:.9rem;}
.hist-item{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px;
  background:var(--ink); border:1px solid var(--line); text-align:left; width:100%;
}
.hist-item:active{transform:scale(.99);}
.hist-item .hi-main{flex:1; min-width:0;}
.hist-item .hi-teams{font-weight:800; font-size:.98rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.hist-item .hi-teams .win{color:var(--ball);}
.hist-item .hi-meta{font-size:.76rem; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums;}
.hist-item .hi-count{font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; flex:0 0 auto;}
.hist-item .hi-del{flex:0 0 auto; color:var(--muted); font-size:1.1rem; padding:6px 8px;}
.hist-detail{margin:6px 0 14px;}
.hist-detail .hd-sets{display:flex; flex-direction:column; gap:6px; font-variant-numeric:tabular-nums;}
.hist-detail .hd-sets .r{display:flex; justify-content:space-between; padding:8px 12px; background:var(--ink); border-radius:9px; border:1px solid var(--line);}

/* ---- share card (offscreen render target) ---- */
#shareCard{
  position:fixed; left:-9999px; top:0; width:720px; padding:48px 52px;
  background:linear-gradient(150deg,#12202e,#0c1620); color:#eef3f8; box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
#shareCard .sc-h{font-size:22px; color:#9fb0c3; letter-spacing:.04em;}
#shareCard .sc-date{font-size:20px; color:#9fb0c3; margin-top:4px;}
#shareCard .sc-teams{display:flex; align-items:center; justify-content:space-between; margin:34px 0 10px; gap:16px;}
#shareCard .sc-team{flex:1; text-align:center;}
#shareCard .sc-team .nm{font-size:34px; font-weight:800; word-break:break-word;}
#shareCard .sc-team .st{font-size:88px; font-weight:800; line-height:1; margin-top:10px; font-variant-numeric:tabular-nums;}
#shareCard .sc-team.win .nm{color:#f4d03f;}
#shareCard .sc-vs{font-size:30px; color:#6b7d92; font-weight:800;}
#shareCard .sc-fmt{text-align:center; color:#9fb0c3; font-size:22px; margin-bottom:26px;}
#shareCard .sc-sets{display:flex; flex-direction:column; gap:10px;}
#shareCard .sc-set{display:flex; justify-content:space-between; font-size:26px; padding:12px 20px; background:rgba(255,255,255,.05); border-radius:12px; font-variant-numeric:tabular-nums;}
#shareCard .sc-set .lbl{color:#9fb0c3;}
#shareCard .sc-foot{margin-top:30px; text-align:right; color:#5b6c80; font-size:18px;}

@media (max-width:520px){
  .side .name{font-size:1rem;}
  .bigbtn{padding:10px 14px; font-size:.82rem;}
}
</style>
<div class="topbar">

<script>
"use strict";
const LS_KEY = "vb_scoreboard_v1";

const DEFAULT = () => ({
  bestOf: 5,
  pointsPerSet: 25,
  decidingPoints: 15,
  winBy: 2,
  timeoutsPerSet: 2,
  teams: [
    {name:"ホーム", sets:0, points:0, timeouts:2},
    {name:"アウェイ", sets:0, points:0, timeouts:2},
  ],
  serving: null,        // 0 | 1 | null
  setNumber: 1,
  completedSets: [],    // [{a, b}]
  matchOver: false,
  switchedThisSet: false,
});

let state = load() || DEFAULT();
let history = [];        // undo stack (snapshots, in-memory)

function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); return s && s.teams ? s : null; }
  catch(e){ return null; }
}
function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function snapshot(){ history.push(JSON.stringify(state)); if(history.length>200) history.shift(); }

function setsToWin(){ return Math.ceil(state.bestOf/2); }
function isDecidingSet(){
  const need = setsToWin();
  return state.teams[0].sets === need-1 && state.teams[1].sets === need-1 && state.bestOf>1;
}
function targetPoints(){ return isDecidingSet() ? state.decidingPoints : state.pointsPerSet; }

/* ---------- scoring ---------- */
function addPoint(t){
  if(state.matchOver) return;
  snapshot();
  const team = state.teams[t];
  team.points++;
  state.serving = t;
  checkCourtSwitch();
  const tgt = targetPoints();
  const opp = state.teams[1-t].points;
  if(team.points >= tgt && team.points - opp >= state.winBy){
    completeSet(t);
  }
  commit();
}

function minusPoint(t){
  const team = state.teams[t];
  if(team.points<=0) return;
  snapshot();
  team.points--;
  commit();
}

function completeSet(winner){
  state.completedSets.push({a:state.teams[0].points, b:state.teams[1].points});
  state.teams[winner].sets++;
  const w = state.teams[winner];
  if(w.sets >= setsToWin()){
    state.matchOver = true;
    saveMatchToHistory();
    commit();
    return;
  }
  // next set
  state.teams[0].points = 0; state.teams[1].points = 0;
  state.teams[0].timeouts = state.timeoutsPerSet;
  state.teams[1].timeouts = state.timeoutsPerSet;
  state.setNumber++;
  state.serving = null;
  state.switchedThisSet = false;
  const dec = isDecidingSet();
  setTimeout(()=> toast(`第${state.setNumber-1}セット終了 → 第${state.setNumber}セットへ`
      + (dec ? " (最終セット・15点先取・8点でコートチェンジ)" : "")), 30);
}

function checkCourtSwitch(){
  if(!isDecidingSet() || state.switchedThisSet) return;
  if(state.teams[0].points>=8 || state.teams[1].points>=8){
    state.switchedThisSet = true;
    setTimeout(()=> toast("★ コートチェンジ (最終セット8点)"), 30);
  }
}

function timeout(t){
  const team = state.teams[t];
  if(team.timeouts<=0){ toast(`${team.name} はこのセットのタイムアウトを使い切りました`); return; }
  snapshot();
  team.timeouts--;
  commit();
  toast(`${team.name} タイムアウト (残り${team.timeouts})`);
}

function toggleServe(){
  snapshot();
  state.serving = state.serving===null ? 0 : (state.serving===0 ? 1 : (state.serving===1 ? null : 0));
  commit();
}

function undo(){
  if(!history.length){ toast("これ以上戻せません"); return; }
  state = JSON.parse(history.pop());
  render(); persist();
}

function resetMatch(){
  const cfg = { bestOf: state.bestOf,
    names:[state.teams[0].name, state.teams[1].name] };
  state = DEFAULT();
  state.bestOf = cfg.bestOf;
  state.teams[0].name = cfg.names[0];
  state.teams[1].name = cfg.names[1];
  history = [];
  commit();
}

function commit(){ render(); persist(); }

/* ---------- render ---------- */
function render(){
  const [h,a] = state.teams;
  document.getElementById("nameHome").textContent = h.name;
  document.getElementById("nameAway").textContent = a.name;
  document.getElementById("scoreHome").textContent = h.points;
  document.getElementById("scoreAway").textContent = a.points;
  document.getElementById("toHome").textContent = h.timeouts;
  document.getElementById("toAway").textContent = a.timeouts;

  document.getElementById("setNo").textContent = `第${state.setNumber}セット`;
  const dec = isDecidingSet();
  document.getElementById("deciding").style.display = dec ? "" : "none";
  const fmtLabel = state.bestOf===1 ? "1セットマッチ" : `${state.bestOf}セットマッチ`;
  document.getElementById("fmt").textContent = `${fmtLabel} / ${targetPoints()}点先取`;

  // sets-won dots
  renderDots("setsHome", h.sets);
  renderDots("setsAway", a.sets);

  // completed sets line
  const line = state.completedSets.map((s,i)=>`(${i+1}) ${s.a}-${s.b}`).join("  ");
  document.getElementById("setScores").textContent = line;

  // serve
  document.getElementById("serveHome").classList.toggle("on", state.serving===0);
  document.getElementById("serveAway").classList.toggle("on", state.serving===1);

  document.getElementById("undoBtn").disabled = history.length===0;

  // match over
  const ov = document.getElementById("overlay");
  if(state.matchOver){
    const winner = h.sets>a.sets ? h : a;
    document.getElementById("winnerText").textContent = `${winner.name} の勝ち！`;
    const games = state.completedSets.map(s=>`${s.a} - ${s.b}`).join("<br>");
    document.getElementById("finalText").innerHTML =
      `セットカウント ${h.sets} - ${a.sets}<br><br>${games}`;
    ov.classList.add("show");
  } else {
    ov.classList.remove("show");
  }
}
function renderDots(id, n){
  const total = setsToWin();
  const el = document.getElementById(id);
  el.innerHTML = "";
  for(let i=0;i<total;i++){
    const d = document.createElement("div");
    d.className = "dot" + (i<n ? " on" : "");
    el.appendChild(d);
  }
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2600);
}

/* ---------- events ---------- */
document.getElementById("sideHome").addEventListener("click", e=>{
  if(e.target.closest(".minictl")) return; addPoint(0);
});
document.getElementById("sideAway").addEventListener("click", e=>{
  if(e.target.closest(".minictl")) return; addPoint(1);
});
document.querySelectorAll("[data-minus]").forEach(b=>
  b.addEventListener("click", e=>{ e.stopPropagation(); minusPoint(+b.dataset.minus); }));
document.querySelectorAll("[data-to]").forEach(b=>
  b.addEventListener("click", e=>{ e.stopPropagation(); timeout(+b.dataset.to); }));
document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("serveToggleBtn").addEventListener("click", toggleServe);
document.getElementById("newMatchBtn").addEventListener("click", resetMatch);

/* settings sheet */
const sheet = document.getElementById("sheet"), sheetBg = document.getElementById("sheetBg");
function openSheet(){
  document.getElementById("inpHome").value = state.teams[0].name;
  document.getElementById("inpAway").value = state.teams[1].name;
  document.querySelectorAll("#segFormat button").forEach(b=>
    b.classList.toggle("active", +b.dataset.bo===state.bestOf));
  updateFormatHint();
  sheet.classList.add("show"); sheetBg.classList.add("show");
}
function closeSheet(){
  const hn = document.getElementById("inpHome").value.trim() || "ホーム";
  const an = document.getElementById("inpAway").value.trim() || "アウェイ";
  if(hn!==state.teams[0].name || an!==state.teams[1].name){
    state.teams[0].name = hn; state.teams[1].name = an; commit();
  }
  sheet.classList.remove("show"); sheetBg.classList.remove("show");
}
function updateFormatHint(){
  const bo = state.bestOf;
  const need = Math.ceil(bo/2);
  document.getElementById("formatHint").textContent =
    bo===1 ? "1セットのみ・25点先取（2点差）。"
    : `先に${need}セット先取で勝ち。最終セットは15点先取（8点でコートチェンジ）。それ以外は25点先取、いずれも2点差がつくまで継続（デュース）。`;
}
document.getElementById("settingsBtn").addEventListener("click", openSheet);
document.getElementById("closeSheetBtn").addEventListener("click", closeSheet);
sheetBg.addEventListener("click", closeSheet);
document.getElementById("resetMatchBtn").addEventListener("click", ()=>{
  if(confirm("現在の試合を最初からやり直します。よろしいですか？")){ resetMatch(); closeSheet(); }
});
document.querySelectorAll("#segFormat button").forEach(b=>
  b.addEventListener("click", ()=>{
    const newBo = +b.dataset.bo;
    if(state.completedSets.length>0 || state.teams[0].points>0 || state.teams[1].points>0){
      if(!confirm("試合形式を変えると現在の試合をリセットします。よろしいですか？")) return;
    }
    state.bestOf = newBo;
    resetMatch();
    document.querySelectorAll("#segFormat button").forEach(x=>
      x.classList.toggle("active", x===b));
    updateFormatHint();
  }));

/* ---------- match history ---------- */
const HIST_KEY = "vb_history_v1";
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)) || []; }catch(e){ return []; } }
function saveHistory(list){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(list)); }catch(e){} }

function currentMatchObject(){
  const [h,a] = state.teams;
  return {
    id: state.savedId || ("m"+Date.now()),
    date: new Date().toISOString(),
    bestOf: state.bestOf,
    teams:[{name:h.name, sets:h.sets},{name:a.name, sets:a.sets}],
    sets: state.completedSets.map(s=>({a:s.a, b:s.b})),
    winner: h.sets>a.sets ? 0 : 1,
  };
}
function saveMatchToHistory(){
  if(state.savedId) return;
  const entry = currentMatchObject();
  const list = loadHistory();
  list.unshift(entry);
  saveHistory(list);
  state.savedId = entry.id;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function clip(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+"…" : s; }
function formatDate(iso){
  const d = new Date(iso);
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  const p = n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日(${w}) ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* history sheet */
const histSheet = document.getElementById("histSheet"), histBg = document.getElementById("histBg");
let histView = "list", histCurrentId = null;
function openHistory(){ histView="list"; histCurrentId=null; renderHist(); histSheet.classList.add("show"); histBg.classList.add("show"); }
function closeHistory(){ histSheet.classList.remove("show"); histBg.classList.remove("show"); }
function histItemHTML(m){
  const n0 = m.winner===0 ? `<span class="win">${esc(m.teams[0].name)}</span>` : esc(m.teams[0].name);
  const n1 = m.winner===1 ? `<span class="win">${esc(m.teams[1].name)}</span>` : esc(m.teams[1].name);
  const fmt = m.bestOf===1 ? "1セット" : m.bestOf+"セットマッチ";
  return `<div class="hist-item" data-open="${m.id}">
    <div class="hi-main">
      <div class="hi-teams">${n0} <span style="color:var(--muted)">vs</span> ${n1}</div>
      <div class="hi-meta">${formatDate(m.date)} ・ ${fmt}</div>
    </div>
    <div class="hi-count">${m.teams[0].sets}-${m.teams[1].sets}</div>
    <button class="hi-del" data-del="${m.id}" aria-label="削除">🗑</button>
  </div>`;
}
function detailHTML(m){
  const rows = m.sets.map((s,i)=>`<div class="r"><span>第${i+1}セット</span><span>${s.a} - ${s.b}</span></div>`).join("");
  return `<div class="hist-detail">
    <div class="hi-meta" style="margin-bottom:12px">${formatDate(m.date)} ・ ${m.bestOf===1?"1セット":m.bestOf+"セットマッチ"}</div>
    <div style="font-size:1.35rem;font-weight:800;margin-bottom:4px">セットカウント ${m.teams[0].sets} - ${m.teams[1].sets}</div>
    <div class="hi-meta" style="margin-bottom:16px">${esc(m.teams[0].name)} vs ${esc(m.teams[1].name)}</div>
    <div class="hd-sets">${rows || '<div class="hi-meta">セット記録なし</div>'}</div>
  </div>`;
}
function renderHist(){
  const body = document.getElementById("histBody");
  const title = document.getElementById("histTitle");
  const backBtn = document.getElementById("histBackBtn");
  const shareBtn = document.getElementById("histShareBtn");
  const list = loadHistory();
  if(histView==="detail" && histCurrentId){
    const m = list.find(x=>x.id===histCurrentId);
    if(!m){ histView="list"; return renderHist(); }
    title.textContent = "試合結果";
    backBtn.style.display=""; shareBtn.style.display="";
    body.innerHTML = detailHTML(m);
    return;
  }
  title.textContent = "試合の履歴";
  backBtn.style.display="none"; shareBtn.style.display="none";
  body.innerHTML = list.length
    ? `<div class="hist-list">${list.map(histItemHTML).join("")}</div>`
    : `<div class="hist-empty">保存された試合はまだありません。<br>試合が終わると自動で保存されます。</div>`;
}

/* ---------- share as image ---------- */
function roundRect(x,rx,ry,w,h,r){ x.beginPath(); x.moveTo(rx+r,ry); x.arcTo(rx+w,ry,rx+w,ry+h,r); x.arcTo(rx+w,ry+h,rx,ry+h,r); x.arcTo(rx,ry+h,rx,ry,r); x.arcTo(rx,ry,rx+w,ry,r); x.closePath(); }
function buildResultCanvas(m){
  const s=2, W=720, rows=m.sets.length, H=440 + rows*68 + 70;
  const c=document.createElement("canvas"); c.width=W*s; c.height=H*s;
  const x=c.getContext("2d"); x.scale(s,s);
  const F='-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif';
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,"#12202e"); g.addColorStop(1,"#0c1620");
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.textAlign="left"; x.fillStyle="#9fb0c3"; x.font=`600 30px ${F}`;
  x.fillText("バレーボール 試合結果", 52, 68);
  x.font=`400 22px ${F}`; x.fillText(formatDate(m.date), 52, 104);
  const [t0,t1]=m.teams, lx=W*0.28, rx=W*0.72;
  x.textAlign="center";
  x.font=`800 38px ${F}`;
  x.fillStyle = m.winner===0?"#f4d03f":"#eef3f8"; x.fillText(clip(t0.name,10), lx,190);
  x.fillStyle = m.winner===1?"#f4d03f":"#eef3f8"; x.fillText(clip(t1.name,10), rx,190);
  x.font=`800 92px ${F}`;
  x.fillStyle = m.winner===0?"#f4d03f":"#eef3f8"; x.fillText(String(t0.sets), lx,296);
  x.fillStyle = m.winner===1?"#f4d03f":"#eef3f8"; x.fillText(String(t1.sets), rx,296);
  x.fillStyle="#6b7d92"; x.font=`800 34px ${F}`; x.fillText("-", W/2, 285);
  x.fillStyle="#9fb0c3"; x.font=`400 22px ${F}`;
  x.fillText(m.bestOf===1?"1セットマッチ":m.bestOf+"セットマッチ", W/2, 350);
  let y=400;
  for(let i=0;i<rows;i++){
    roundRect(x,52,y,W-104,56,12); x.fillStyle="rgba(255,255,255,.05)"; x.fill();
    x.fillStyle="#9fb0c3"; x.font=`400 24px ${F}`; x.textAlign="left"; x.fillText(`第${i+1}セット`, 74, y+37);
    x.fillStyle="#eef3f8"; x.font=`700 26px ${F}`; x.textAlign="right"; x.fillText(`${m.sets[i].a} - ${m.sets[i].b}`, W-74, y+37);
    y+=68;
  }
  x.fillStyle="#5b6c80"; x.font=`400 18px ${F}`; x.textAlign="right"; x.fillText("バレー スコアボード", W-52, H-40);
  return c;
}
function shareMatch(m){
  const canvas = buildResultCanvas(m);
  canvas.toBlob(async (blob)=>{
    if(!blob){ toast("画像の生成に失敗しました"); return; }
    const fname = `volleyball_${new Date(m.date).toISOString().slice(0,10)}.png`;
    const file = new File([blob], fname, {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:"試合結果"}); return; }
      catch(e){ if(e && e.name==="AbortError") return; }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    toast("結果を画像で保存しました");
  }, "image/png");
}

document.getElementById("historyBtn").addEventListener("click", openHistory);
document.getElementById("closeHistBtn").addEventListener("click", closeHistory);
histBg.addEventListener("click", closeHistory);
document.getElementById("histBackBtn").addEventListener("click", ()=>{ histView="list"; histCurrentId=null; renderHist(); });
document.getElementById("histShareBtn").addEventListener("click", ()=>{
  const m = loadHistory().find(x=>x.id===histCurrentId); if(m) shareMatch(m);
});
document.getElementById("shareResultBtn").addEventListener("click", ()=> shareMatch(currentMatchObject()));
document.getElementById("histBody").addEventListener("click", e=>{
  const del = e.target.closest("[data-del]");
  if(del){ e.stopPropagation();
    if(confirm("この試合の記録を削除しますか？")){ saveHistory(loadHistory().filter(x=>x.id!==del.dataset.del)); renderHist(); }
    return;
  }
  const open = e.target.closest("[data-open]");
  if(open){ histView="detail"; histCurrentId=open.dataset.open; renderHist(); }
});

// prevent accidental double-tap zoom
document.addEventListener("dblclick", e=> e.preventDefault(), {passive:false});

render();
</script>
